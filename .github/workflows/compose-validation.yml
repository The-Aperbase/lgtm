name: Compose validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    env:
      GRAFANA_DOMAIN: grafana.example.com
      OTEL_DOMAIN: otel.example.com
      OTEL_API_KEY: validation-only-api-key
      GRAFANA_GOOGLE_CLIENT_ID: validation-only-client-id
      GRAFANA_GOOGLE_CLIENT_SECRET: validation-only-client-secret
      GRAFANA_ADMIN_PASSWORD: validation-only-admin-password
      GRAFANA_GOOGLE_ROLE_ATTRIBUTE_PATH: >-
        email == 'admin.one@example.com' && 'GrafanaAdmin' ||
        email == 'admin.two@example.com' && 'GrafanaAdmin' ||
        email == 'viewer@example.com' && 'Viewer'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Docker stack
        run: docker stack config -c deploy-compose.yml > /tmp/deploy-compose.rendered.yml

      - name: Validate Cloudflare and overlay routing
        run: bash scripts/validate-routing.sh

      - name: Validate OpenTelemetry Collector configuration
        run: >-
          docker run --rm
          -e OTEL_API_KEY=validation-only-api-key
          -v "$PWD/config/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro"
          otel/opentelemetry-collector-contrib:0.157.0
          validate --config=/etc/otelcol-contrib/config.yaml

      - name: Validate Loki configuration
        run: >-
          docker run --rm
          -v "$PWD/config/loki.yaml:/etc/loki/config.yaml:ro"
          grafana/loki:3.7.4
          -config.file=/etc/loki/config.yaml
          -verify-config=true

      - name: Validate Tempo configuration
        run: >-
          docker run --rm
          -v "$PWD/config/tempo.yaml:/etc/tempo/config.yaml:ro"
          grafana/tempo:3.0.2
          -config.file=/etc/tempo/config.yaml
          -config.verify=true

      - name: Validate Mimir configuration
        run: >-
          docker run --rm
          -v "$PWD/config/mimir.yaml:/etc/mimir/config.yaml:ro"
          grafana/mimir:3.1.4
          -config.file=/etc/mimir/config.yaml
          -modules=true
