name: Validate and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_to_production:
        description: Deploy the observability stack to production
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: observability-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate machine preparation script
        run: sh -n scripts/prepare-swarm-node.sh

      - name: Validate Docker stack
        env:
          GRAFANA_ADMIN_PASSWORD: validation-only
          GRAFANA_ROOT_URL: https://grafana.example.com
          GRAFANA_GOOGLE_CLIENT_ID: validation-only
          GRAFANA_GOOGLE_CLIENT_SECRET: validation-only
          GRAFANA_GOOGLE_ADMIN_EMAIL_1: admin.one@example.com
          GRAFANA_GOOGLE_ADMIN_EMAIL_2: admin.two@example.com
        run: docker stack config --compose-file compose.yml > /tmp/observability-stack.yml

      - name: Validate private routing
        env:
          GRAFANA_ADMIN_PASSWORD: validation-only
          GRAFANA_ROOT_URL: https://grafana.example.com
          GRAFANA_GOOGLE_CLIENT_ID: validation-only
          GRAFANA_GOOGLE_CLIENT_SECRET: validation-only
          GRAFANA_GOOGLE_ADMIN_EMAIL_1: admin.one@example.com
          GRAFANA_GOOGLE_ADMIN_EMAIL_2: admin.two@example.com
        run: |
          docker compose --file compose.yml config --format json > /tmp/observability-compose.json
          node scripts/validate-compose.mjs /tmp/observability-compose.json

      - name: Validate Alloy configuration
        run: >-
          docker run --rm
          -v "${{ github.workspace }}/config/alloy/config.alloy:/etc/alloy/config.alloy:ro"
          grafana/alloy:v1.18.0
          validate /etc/alloy/config.alloy

      - name: Validate Loki configuration
        run: >-
          docker run --rm
          -v "${{ github.workspace }}/config/loki/config.yml:/etc/loki/config.yml:ro"
          grafana/loki:3.7.4
          -config.file=/etc/loki/config.yml
          -verify-config=true

      - name: Validate Tempo configuration
        run: >-
          docker run --rm
          -v "${{ github.workspace }}/config/tempo/config.yml:/etc/tempo/config.yml:ro"
          grafana/tempo:3.0.2
          -config.file=/etc/tempo/config.yml
          -config.verify=true

      - name: Validate Prometheus configuration
        run: >-
          docker run --rm
          -v "${{ github.workspace }}/config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
          --entrypoint promtool
          prom/prometheus:v3.13.1
          check config /etc/prometheus/prometheus.yml

  deploy:
    needs: validate
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_to_production)
    runs-on: ubuntu-latest
    env:
      DEPLOY_CONFIGURED: >-
        ${{ secrets.TS_OAUTH_CLIENT_ID != '' &&
            secrets.TS_AUDIENCE != '' &&
            secrets.DOKPLOY_API_TOKEN != '' &&
            vars.DOKPLOY_COMPOSE_ID != '' }}

    steps:
      - name: Validate deployment configuration
        if: env.DEPLOY_CONFIGURED != 'true'
        run: |
          echo "Deployment requires the documented Actions variable and organization or repository secrets." >&2
          exit 1

      - name: Connect to Tailscale
        if: env.DEPLOY_CONFIGURED == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      - name: Confirm Dokploy connectivity
        if: env.DEPLOY_CONFIGURED == 'true'
        run: tailscale ping --timeout=10s dokbox

      - name: Trigger Dokploy deployment
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
        run: |
          payload="$(jq -n --arg composeId "$DOKPLOY_COMPOSE_ID" '{composeId: $composeId}')"
          curl -fsS -X POST "http://dokbox:3000/api/compose.deploy" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_TOKEN" \
            --data "$payload"
